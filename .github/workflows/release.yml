name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current package version to npm
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm trusted-publishing support
        run: |
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE'
          const [version] = process.argv.slice(2);
          const [major, minor] = version.split(".").map(Number);
          if (major < 11 || (major === 11 && minor < 5)) {
            console.error(`npm ${version} cannot use OIDC trusted publishing; requires npm >=11.5.1`);
            process.exit(1);
          }
          NODE

      - name: Verify release contract
        run: node --test test/release-contract.test.cjs

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: ./node_modules/.bin/jest --runInBand --forceExit

      - name: Build plugin
        run: ./node_modules/.bin/medusa plugin:build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Verify release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version"

      - name: Verify build output
        run: |
          test -f .medusa/server/src/modules/checkout_tracking/index.js
          test -f .medusa/server/src/api/store/checkout-tracking/route.js
          test -f .medusa/server/src/api/admin/checkout-tracking/route.js

      - name: Check npm registry
        id: registry
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: pnpm pack --dry-run

      - name: Publish to npm
        if: steps.registry.outputs.exists != 'true' && (github.event_name == 'release' || inputs.publish == true)
        run: npm publish --access public
